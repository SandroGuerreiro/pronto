[package]
name = "pronto"
version = "0.9.1"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "pronto_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["macos-private-api", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.13.2", features = ["json"] }
tokio = { version = "1.51.1", features = ["full"] }
futures = "0.3"
open = "5.3.3"
chrono = "0.4.44"
tauri-plugin-positioner = { version = "2.3.1", features = ["tray-icon"] }
tauri-plugin-process = "2.3.1"
image = "0.25"
tauri-plugin-global-shortcut = "2.3.1"
tauri-plugin-notification = "2.3.3"
keyring = { version = "3.6.3", features = ["apple-native"] }
security-framework = "3"
security-framework-sys = "2"
core-foundation = "0.10"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSPanel", "NSResponder", "NSWindow", "NSApplication", "NSRunningApplication", "NSWorkspace", "NSScreen", "NSEvent", "NSSound"] }
objc2-core-foundation = "0.3"
objc2-user-notifications = { version = "0.3.2", features = ["UNUserNotificationCenter", "UNNotificationContent", "UNNotificationRequest", "UNNotificationResponse", "UNNotificationAction", "UNNotificationCategory", "UNNotificationSettings", "block2"] }
block2 = "0.6.2"
objc2-foundation = "0.3.2"


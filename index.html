<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pronto</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="panel">
      <header class="panel-header">
        <img src="/logo.png" alt="pronto" class="panel-logo" />
        <span id="workflow-indicator" class="workflow-indicator" style="display: none;"></span>
      </header>

      <div class="panel-main">
        <nav id="main-nav" class="sidebar" style="display: none;">
          <button class="nav-item active" data-tab="mine" title="My open PRs">
            <span class="nav-icon">⊕</span>
            <span class="nav-label">Owned</span>
          </button>
          <button class="nav-item" data-tab="followed" title="Followed developers">
            <span class="nav-icon">◉</span>
            <span class="nav-label">Followed</span>
          </button>
          <button class="nav-item" data-tab="merged" title="Recently merged">
            <span class="nav-icon">✓</span>
            <span class="nav-label">Merged</span>
          </button>
          <button class="nav-item" data-tab="closed" title="Recently closed">
            <span class="nav-icon">✕</span>
            <span class="nav-label">Closed</span>
          </button>

          <div class="nav-spacer"></div>

          <button class="nav-item" data-tab="settings" id="settings-btn" title="Settings">
            <span class="nav-icon">⚙</span>
            <span class="nav-label">Settings</span>
          </button>

          <div class="nav-divider"></div>

          <button class="nav-item nav-item-action" id="signout-btn" title="Sign out" style="display: none;">
            <span class="nav-icon">↪</span>
            <span class="nav-label">Sign out</span>
          </button>
          <button class="nav-item nav-item-action" id="quit-btn" title="Quit">
            <span class="nav-icon">✕</span>
            <span class="nav-label">Quit</span>
          </button>
        </nav>

        <div class="panel-body">
          <div id="content">
            <div class="loading">Loading...</div>
          </div>
        </div>
      </div>

      <div class="panel-footer">
        <div id="spinner" class="spinner" style="display: none;"></div>
        <span id="poll-status" class="poll-status"></span>
      </div>
    </div>
  </body>
</html>

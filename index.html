<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pronto</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="panel">
      <header class="panel-header">
        <img src="/logo.png" alt="pronto" class="panel-logo" />
        <span id="workflow-indicator" class="workflow-indicator" style="display: none;"></span>
      </header>

      <div class="panel-main">
        <nav id="main-nav" class="sidebar" style="display: none;">
          <button class="nav-item active" data-tab="mine" title="My open PRs">
            <span class="nav-icon">⊕</span>
            <span class="nav-label">Owned</span>
          </button>
          <button class="nav-item" data-tab="requests" title="Review requests">
            <span class="nav-icon">⇥</span>
            <span class="nav-label">Requests</span>
          </button>
          <button class="nav-item" data-tab="watched" title="Watched developers">
            <span class="nav-icon">◉</span>
            <span class="nav-label">Watched</span>
          </button>
          <button class="nav-item" data-tab="merged" title="Recently merged">
            <span class="nav-icon">✓</span>
            <span class="nav-label">Merged</span>
          </button>
          <button class="nav-item" data-tab="closed" title="Recently closed">
            <span class="nav-icon">✕</span>
            <span class="nav-label">Closed</span>
          </button>

          <div class="nav-spacer"></div>

          <div id="avatar-menu" class="avatar-menu">
            <button class="avatar-btn" id="avatar-btn" title="Account">
              <span class="avatar-img-wrap">
                <img id="avatar-img" class="avatar-img" alt="" />
              </span>
            </button>
            <div class="avatar-popover" id="avatar-popover">
              <button class="avatar-popover-item" id="profile-btn">
                <span class="popover-icon">◐</span>Profile
              </button>
              <button class="avatar-popover-item" data-tab="settings" id="settings-btn">
                <span class="popover-icon">⚙</span>Settings
              </button>
              <div class="avatar-popover-sep"></div>
              <button class="avatar-popover-item" id="signout-btn" style="display: none;">
                <span class="popover-icon">↪</span><span class="popover-label">Sign out</span>
              </button>
            </div>
          </div>

          <button class="nav-item nav-item-action" id="quit-btn" title="Quit">
            <span class="nav-icon">✕</span>
            <span class="nav-label">Quit</span>
          </button>
        </nav>

        <div class="panel-body">
          <div id="content">
            <div class="loading">Loading...</div>
          </div>
        </div>
      </div>

      <div class="panel-footer">
        <span id="version-text" class="version-text"></span>
        <span id="brew-indicator" class="brew-indicator" style="display:none"></span>
        <span id="poll-status" class="poll-status"></span>
        <div id="spinner" class="spinner" style="display: none;"></div>
      </div>
    </div>
  </body>
</html>

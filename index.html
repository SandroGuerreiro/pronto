<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="/src/styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>pronto</title>
    <script type="module" src="/src/main.ts" defer></script>
  </head>

  <body>
    <div class="panel">
      <header class="panel-header">
        <img src="/logo.png" alt="pronto" class="panel-logo" />
        <span class="panel-subtitle">PR status</span>
        <span id="workflow-indicator" class="workflow-indicator" style="display: none;"></span>
        <button id="settings-btn" class="header-settings-btn" style="display: none;" title="Settings">⚙</button>
      </header>

      <div id="tab-bar" class="tab-bar" style="display: none;">
        <button class="tab active" data-tab="open">Open</button>
        <button class="tab" data-tab="merged">Recently Merged</button>
      </div>

      <div class="panel-body">
        <div id="content">
          <div class="loading">Loading...</div>
        </div>

        <div id="settings-panel" class="settings-overlay" style="display: none;"></div>
      </div>

      <footer class="panel-footer">
        <div class="footer-actions">
          <button id="signout-btn" class="footer-btn" style="display: none;">Sign out</button>
          <button id="quit-btn" class="footer-btn">Quit</button>
        </div>
      </footer>
    </div>
  </body>
</html>
